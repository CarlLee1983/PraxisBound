name: PraxisBound verification

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up verification tooling
        uses: ./.github/actions/setup-verification
        with:
          cache: true

      - name: Verify
        run: make verify

  tooling-compatibility:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest
        node-version:
          - 22.13.0
          - 22.x
          - 24.0.0
          - 24.x
          - 26.0.0
          - 26.x
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true

      - name: Install locked tooling dependencies
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true

      - name: Verify tooling packages
        run: make verify-tooling

  portability:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            shell: /bin/sh
          - runner: ubuntu-latest
            shell: /bin/dash
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify portable shell behavior
        env:
          PATH: /usr/bin:/bin
          PORTABILITY_SHELL: ${{ matrix.shell }}
        run: make verify-portability
